<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerte Radar Live</title>

  <!-- 1. CSS et JS Leaflet de base (doit TOUJOURS être en premier) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 2. CSS et JS Leaflet Routing Machine (via CDNJS pour plus de sécurité) -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.css" />
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>

  <!-- 3. CSS et JS Leaflet Control Geocoder (BARRE DE RECHERCHE) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <!-- 4. Tes fichiers personnels -->
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
  <div class="app-container">
    <!-- En-tête dynamique -->
    <header id="main-header">
      <div class="header-top">
        <h1>Alerte Radar Live</h1>
        <span id="gps-status" class="status-badge attente">GPS en attente...</span>
      </div>

      <!-- Bouton pour démarrer le GPS -->
      <button id="btn-start" class="btn-start">Activer le GPS & l'Audio</button>

      <!-- Tableau de bord temps réel -->
      <div class="dashboard">
        <div class="box">
          <span class="label">Vitesse actuelle</span>
          <span id="current-speed" class="value">0 <small class="unit">km/h</small></span>
        </div>

        <!-- Boutons de contrôle de l'itinéraire (à placer sous le dashboard par exemple) -->
        <div id="navigation-controls"
          style="padding: 10px; text-align: center; background: #2c3e50; color: white; display: none;">
          <span id="nav-info-text" style="margin-right: 15px; font-weight: bold;">Guidage actif</span>
          <button id="btn-details" style="padding: 5px 10px; margin-right: 10px; cursor: pointer;">📋 Détails du
            trajet</button>
          <button id="btn-voice-toggle"
            style="padding: 5px 10px; margin-right: 10px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">🔇
            Voix : OFF</button>
          <button id="btn-stop-nav"
            style="padding: 5px 10px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">🛑
            Arrêter le guidage</button>
        </div>

        <!-- Fenêtre modale pour les détails du trajet -->
        <div id="modal-details"
          style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
          <div
            style="background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; color: #333;">
            <h2>Étapes de l'itinéraire</h2>
            <div id="instructions-container" style="margin: 15px 0;"></div>
            <button id="btn-close-modal"
              style="padding: 8px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; float: right;">Fermer</button>
          </div>
        </div>

        <div class="separator"></div>

        <div class="box">
          <span id="next-radar-label" class="label">Prochain Radar (-- km/h)</span>
          <span id="next-camera-dist" class="value">Calcul...</span>
        </div>
      </div>
    </header>

    <!-- Barre de favoris -->
    <div id="favorites-bar" class="favorites-bar">
      <button class="btn-favori" onclick="lancerFavori(48.20169367284245, 2.5496722189161316)">🏠 Maison (Ichy)</button>
      <button class="btn-favori" onclick="lancerFavori(48.469749, 2.695799)">🏠 37 rue Moreau de Tours</button>
      <button class="btn-favori" onclick="lancerFavori(48.8566, 2.3522)">🗼 Paris</button>
    </div>

    <!-- Options d'itinéraire -->
    <div id="route-options"
      style="display: flex; gap: 15px; justify-content: center; padding: 10px; background: #0b132b; border-bottom: 1px solid #34495e;">
      <label style="color: white; font-size: 0.9rem; display: flex; align-items: center; gap: 5px;">
        <input type="checkbox" id="check-peage"> Sans péage
      </label>
      <label style="color: white; font-size: 0.9rem; display: flex; align-items: center; gap: 5px;">
        <input type="checkbox" id="check-autoroute"> Sans autoroute
      </label>
    </div>

    <!-- Bannière d'alerte masquée par défaut -->
    <div id="alert-banner" class="alert-banner hidden">
      <span id="alert-text">⚠️ Alerte Radar proche</span>
    </div>

    <!-- Indicateur de chargement des radars -->
    <div id="loading-radars"
      style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif;">
      <div style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">Chargement des radars en cours...</div>
      <div style="font-size: 14px; color: #ccc;">Le serveur cloud se réveille, veuillez patienter quelques secondes.
      </div>
    </div>

    <!-- Carte -->
    <div id="map">
      <button id="btn-recentrer">📍 Recentrer</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((reg) => {
            console.log('Service Worker enregistré avec succès, scope:', reg.scope);
          })
          .catch((err) => {
            console.log('Erreur d\'enregistrement du Service Worker:', err);
          });
      });
    }
  </script>

  <!-- Ton fichier JS (et SEULEMENT lui en bas) -->
  <script src="app.js"></script>
</body>

</html>
