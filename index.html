<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerte Radar Live</title>
    <!-- CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- En-tête dynamique (qui changera de couleur selon l'alerte) -->
    <header id="main-header">
      <div class="header-top">
        <h1>Alerte Radar Live</h1>
        <span id="gps-status" class="status-badge attente">GPS en attente...</span>
      </div>

      <!-- Bouton pour démarrer le GPS sur le web -->
      <button id="btn-start" class="btn-start">Activer le GPS & l'Audio</button>

      <!-- Tableau de bord temps réel (Modèle React) -->
      <div class="dashboard">
        <div class="box">
          <span class="label">Vitesse actuelle</span>
          <span id="current-speed" class="value">0 <small class="unit">km/h</small></span>
        </div>

        <div class="separator"></div>

        <div class="box">
          <span id="next-radar-label" class="label">Prochain Radar (-- km/h)</span>
          <span id="next-camera-dist" class="value">Calcul...</span>
        </div>
      </div>
    </header>

    <!-- Carte -->
    <div id="map"></div>
  </div>

  <!-- JS Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
